<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistente de Análise</title>
  <style>
    :root {
      --bg-card: #0b1324;
      --bg-panel: #111b33;
      --bg-msg-ai: #14203b;
      --bg-msg-user: #102a56;
      --border-color: #1f335c;
      --border-user: #2554a3;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --danger-bg: #2d141c;
      --danger-border: #7f1d1d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background-color: transparent;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text-main);
      overflow: hidden;
    }

    .widget-container {
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #0b1324 0%, #09101f 100%);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
      color: var(--text-main);
    }

    .sparkle-icon { color: #60a5fa; font-size: 15px; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .btn-reset {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: 6px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-reset:hover {
      background: rgba(59, 130, 246, 0.15);
      color: var(--text-main);
      border-color: var(--accent);
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .chat-area::-webkit-scrollbar { width: 5px; }
    .chat-area::-webkit-scrollbar-track { background: transparent; }
    .chat-area::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }

    .msg-bubble {
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 12.5px;
      line-height: 1.55;
      word-wrap: break-word;
    }

    .msg-ai {
      background-color: var(--bg-msg-ai);
      border: 1px solid var(--border-color);
      color: #e2e8f0;
      align-self: stretch;
    }

    .msg-user {
      background-color: var(--bg-msg-user);
      border: 1px solid var(--border-user);
      color: #ffffff;
      align-self: flex-end;
      max-width: 85%;
    }

    .msg-error {
      background-color: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: #fecaca;
    }

    .msg-ai p { margin-bottom: 8px; }
    .msg-ai p:last-child { margin-bottom: 0; }
    .msg-ai ul, .msg-ai ol { margin: 6px 0 8px 18px; }
    .msg-ai li { margin-bottom: 4px; }
    .msg-ai strong { color: #ffffff; font-weight: 600; }

    .suggestions-box {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 2px;
    }

    .suggestions-label {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .suggestion-chip {
      width: 100%;
      text-align: left;
      background-color: rgba(17, 27, 51, 0.85);
      border: 1px solid var(--border-color);
      color: #cbd5e1;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .suggestion-chip:hover {
      background-color: rgba(30, 58, 138, 0.45);
      border-color: var(--accent);
      color: #ffffff;
    }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 2px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      background-color: #60a5fa;
      border-radius: 50%;
      animation: bounce 1.3s infinite ease-in-out both;
    }

    .typing span:nth-child(1) { animation-delay: -0.32s; }
    .typing span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    .input-footer {
      padding: 12px 14px;
      border-top: 1px solid var(--border-color);
      background-color: #09101f;
      flex-shrink: 0;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 4px 6px 4px 12px;
      transition: border-color 0.2s;
    }

    .input-wrapper:focus-within { border-color: var(--accent); }

    .input-wrapper input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 12.5px;
      padding: 6px 0;
    }

    .input-wrapper input::placeholder { color: #64748b; }

    .btn-send {
      background: transparent;
      border: none;
      color: #60a5fa;
      width: 30px;
      height: 30px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-send:hover:not(:disabled) {
      background-color: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
    }

    .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="widget-container">
    <div class="header">
      <div class="header-left">
        <span class="sparkle-icon">✦</span>
        <span>Assistente de análise</span>
      </div>
      <div class="header-right">
        <span id="data-atualizacao">Carregando...</span>
        <button class="btn-reset" id="btn-reset" title="Reiniciar conversa">↻</button>
      </div>
    </div>

    <div class="chat-area" id="chat-area">
      <div class="msg-bubble msg-ai" id="insight-inicial">
        Carregando base de dados...
      </div>

      <div class="suggestions-box" id="suggestions-box">
        <div class="suggestions-label">Sugestões rápidas</div>
        <button class="suggestion-chip" data-q="Resuma o desempenho do último mês disponível, destacando faturamento, pedidos, margem e variações.">Resumir o mês</button>
        <button class="suggestion-chip" data-q="Onde estou perdendo margem? Aponte as categorias, produtos e estados com menor rentabilidade.">Onde perco margem?</button>
        <button class="suggestion-chip" data-q="Quais clientes mais crescem e quais têm maior faturamento e margem?">Quais clientes crescem?</button>
      </div>
    </div>

    <div class="input-footer">
      <form class="input-wrapper" id="chat-form">
        <input type="text" id="user-input" placeholder="Pergunte sobre os dados" autocomplete="off" />
        <button type="submit" class="btn-send" id="btn-send" title="Enviar">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <script>
    // SUBSTITUA PELA URL DO SEU WORKER NO CLOUDFLARE
    const WORKER_URL = 'https://woker.smg28341133.workers.dev';
    const DADOS_URL = './dados_ia.json';
    const CACHE_KEY = 'cache_dados_ia_v2';

    let baseDados = null;
    let historicoConversa = [];
    let enviando = false;

    const chatArea = document.getElementById('chat-area');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const btnSend = document.getElementById('btn-send');
    const btnReset = document.getElementById('btn-reset');
    const insightInicialEl = document.getElementById('insight-inicial');
    const dataAtualizacaoEl = document.getElementById('data-atualizacao');
    const suggestionsBox = document.getElementById('suggestions-box');

    function aplicarBaseNaTela(dados) {
      baseDados = dados;
      dataAtualizacaoEl.textContent = dados.atualizado_em
        ? dados.atualizado_em.split(' ')[0]
        : 'Atualizado';
      insightInicialEl.innerHTML = formatarMarkdown(
        dados.insight_inicial || 'Base carregada. Faça sua pergunta abaixo.'
      );
    }

    async function carregarBaseDados() {
      const cacheLocal = localStorage.getItem(CACHE_KEY);
      if (cacheLocal) {
        try {
          aplicarBaseNaTela(JSON.parse(cacheLocal));
        } catch (e) {}
      }

      try {
        const resp = await fetch(`${DADOS_URL}?v=${Date.now()}`);
        if (!resp.ok) throw new Error('Falha ao carregar dados_ia.json');
        const dadosNovos = await resp.json();
        localStorage.setItem(CACHE_KEY, JSON.stringify(dadosNovos));
        aplicarBaseNaTela(dadosNovos);
      } catch (err) {
        if (!baseDados) {
          insightInicialEl.textContent = 'Erro ao carregar dados_ia.json. Verifique a publicação no GitHub Pages.';
          insightInicialEl.classList.add('msg-error');
        }
      }
    }

    function formatarMarkdown(texto) {
      let html = texto
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

      const linhas = html.split('\n');
      let resultado = [];
      let emLista = false;

      for (let linha of linhas) {
        const trim = linha.trim();
        if (trim.startsWith('- ') || trim.startsWith('* ')) {
          if (!emLista) {
            resultado.push('<ul>');
            emLista = true;
          }
          resultado.push(`<li>${trim.substring(2)}</li>`);
        } else {
          if (emLista) {
            resultado.push('</ul>');
            emLista = false;
          }
          if (trim.length > 0) {
            resultado.push(`<p>${trim}</p>`);
          }
        }
      }
      if (emLista) resultado.push('</ul>');
      return resultado.join('');
    }

    function adicionarMensagem(texto, tipo = 'ai') {
      const div = document.createElement('div');
      div.className = `msg-bubble ${tipo === 'user' ? 'msg-user' : tipo === 'error' ? 'msg-ai msg-error' : 'msg-ai'}`;
      div.innerHTML = tipo === 'user' ? texto : formatarMarkdown(texto);
      chatArea.appendChild(div);
      chatArea.scrollTop = chatArea.scrollHeight;
      return div;
    }

    function mostrarDigitando() {
      const div = document.createElement('div');
      div.className = 'msg-bubble msg-ai';
      div.id = 'typing-indicator';
      div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
      chatArea.appendChild(div);
      chatArea.scrollTop = chatArea.scrollHeight;
      return div;
    }

    // Seleção compacta do contexto para caber com folga no limite gratuito do Gemini e do Groq
    function selecionarContextoInteligente(pergunta) {
      if (!baseDados) return {};
      const q = pergunta.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

      const pacote = {
        geral: baseDados.geral,
        anos: baseDados.ano
      };

      const mesesMap = {
        janeiro: 'Janeiro', jan: 'Janeiro',
        fevereiro: 'Fevereiro', fev: 'Fevereiro',
        marco: 'Março', mar: 'Março',
        abril: 'Abril', abr: 'Abril',
        maio: 'Maio', mai: 'Maio',
        junho: 'Junho', jun: 'Junho',
        julho: 'Julho', jul: 'Julho',
        agosto: 'Agosto', ago: 'Agosto',
        setembro: 'Setembro', set: 'Setembro',
        outubro: 'Outubro', out: 'Outubro',
        novembro: 'Novembro', nov: 'Novembro',
        dezembro: 'Dezembro', dez: 'Dezembro'
      };

      let mesNormalizado = null;
      for (const [chave, valor] of Object.entries(mesesMap)) {
        if (new RegExp(`\\b${chave}\\b`).test(q)) {
          mesNormalizado = valor;
          break;
        }
      }

      if (!mesNormalizado && /ultimo mes|mes atual|resuma o mes|resumir o mes|desempenho do mes/.test(q)) {
        mesNormalizado = baseDados.geral.ultimo_mes_disponivel.split('/')[0];
      }

      const anoMatch = q.match(/\b(20)?(24|25|26)\b/);
      const anoAlvo = anoMatch ? '20' + anoMatch[2] : baseDados.geral.ultimo_mes_disponivel.split('/')[1];

      if (mesNormalizado) {
        // Envia o mês pedido em TODOS os anos (ex: dezembro/2024, dezembro/2025, dezembro/2026) + mês anterior do ano alvo
        const idx = baseDados.mes.findIndex(m => m.periodo === `${mesNormalizado}/${anoAlvo}`);
        const mesAnterior = idx > 0 ? [baseDados.mes[idx - 1]] : [];
        const mesmoMesOutrosAnos = baseDados.mes.filter(m => m.periodo.startsWith(mesNormalizado + '/'));

        const mapaMeses = new Map();
        [...mesAnterior, ...mesmoMesOutrosAnos].forEach(m => mapaMeses.set(m.periodo, m));
        pacote.meses = Array.from(mapaMeses.values());

        pacote.categorias_no_mes = (baseDados.cat_mes || [])
          .filter(item => item.periodo.startsWith(mesNormalizado + '/'))
          .map(i => ({ per: i.periodo, cat: i.categoria, ped: i.pedidos, rec: i.receita_formatada, luc: i.lucro_formatado, mg: i.margem_pct }));
        pacote.top_produtos_no_mes = (baseDados.prod_mes || [])
          .filter(item => item.periodo === `${mesNormalizado}/${anoAlvo}`)
          .map(i => ({ prod: i.produto, ped: i.pedidos, rec: i.receita_formatada, mg: i.margem_pct }));
      } else {
        // Envia os 12 meses do ano alvo + últimos 3 meses anteriores
        const mesesAno = baseDados.mes.filter(m => m.periodo.endsWith(`/${anoAlvo}`));
        pacote.meses = mesesAno.length > 0 ? mesesAno : baseDados.mes.slice(-12);
      }

      const querCategoria = /categor|suplement|oleo|grao|outros|margem/.test(q);
      const querProduto = /produt|creatina|omega|pre-treino|whey|item|itens|margem/.test(q);
      const querEstado = /estado|uf|\bsp\b|\brj\b|\bmg\b|\bes\b|regiao|margem/.test(q);
      const querCliente = /client|comprador|cresce|crescimento|recorren/.test(q);

      if (querCategoria || (!mesNormalizado && !querProduto && !querEstado && !querCliente)) {
        pacote.categorias = (baseDados.categoria || []).map(i => ({
          cat: i.categoria, ped: i.pedidos, rec: i.receita_formatada, luc: i.lucro_formatado, mg: i.margem_pct
        }));
      }
      if (querProduto) {
        pacote.produtos = (baseDados.produto || []).slice(0, 12).map(i => ({
          prod: i.produto, ped: i.pedidos, rec: i.receita_formatada, luc: i.lucro_formatado, mg: i.margem_pct
        }));
      }
      if (querEstado) {
        pacote.estados = (baseDados.estado || []).map(i => ({
          uf: i.estado, ped: i.pedidos, rec: i.receita_formatada, luc: i.lucro_formatado, mg: i.margem_pct
        }));
      }
      if (querCliente) {
        pacote.top_clientes = (baseDados.cliente_top || []).slice(0, 10).map(i => ({
          cli: i.cliente, ped: i.pedidos, rec: i.receita_formatada, mg: i.margem_pct
        }));
        pacote.clientes_crescimento = (baseDados.cliente_crescimento || []).slice(0, 8).map(i => ({
          cli: i.cliente, ant: i.receita_anterior_fmt, atu: i.receita_atual_fmt, var_pct: i.variacao_pct
        }));
      }

      return pacote;
    }

    async function enviarPergunta(textoUsuario) {
      if (!textoUsuario.trim() || enviando) return;
      if (!baseDados) {
        adicionarMensagem('Aguarde o carregamento da base de dados antes de perguntar.', 'error');
        return;
      }

      enviando = true;
      btnSend.disabled = true;
      userInput.value = '';
      if (suggestionsBox) suggestionsBox.style.display = 'none';

      adicionarMensagem(textoUsuario, 'user');
      const typingEl = mostrarDigitando();

      const contextoFiltrado = selecionarContextoInteligente(textoUsuario);
      const dadosJsonCompacto = JSON.stringify(contextoFiltrado);

      const instrucaoSistema = `Você é o Analista de BI Executivo integrado a este painel comercial.
Responda em português do Brasil com tom consultivo, natural, direto e objetivo.

REGRAS ESTRITAS:
1. USE EXCLUSIVAMENTE OS DADOS DO JSON FORNECIDO. Nunca invente valores ou datas. Se um recorte não estiver presente no JSON, informe de maneira natural que essa abertura específica não consta na base atual.
2. NUNCA mencione nomes de chaves técnicas do JSON (como "receita_formatada", "var_receita_mom_pct", "rec", "luc", "mg", "ped") e NUNCA faça cálculos manuais aproximados quando o valor formatado já estiver no JSON. Use os valores exatos em R$ e %.
3. NÃO inicie a resposta com frases robóticas como "Com base nos dados fornecidos", "De acordo com o JSON", "Olá" ou "Aqui está". Vá direto ao ponto na primeira frase e nunca use subtítulos ou seções artificiais como "Pontos de atenção" ou "Em resumo" — finalize naturalmente em texto corrido.
4. Destaque em **negrito** os números-chave (faturamento, margem %, pedidos, ticket médio e variações) e organize comparações ou rankings em tópicos curtos e escaneáveis.`;

      historicoConversa.push({
        role: 'user',
        parts: [{
          text: `DADOS RELEVANTES:\n${dadosJsonCompacto}\n\nPERGUNTA:\n${textoUsuario}`
        }]
      });

      const mensagensParaEnviar = historicoConversa.slice(-4);

      try {
        const resp = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: instrucaoSistema }] },
            contents: mensagensParaEnviar
          })
        });

        const data = await resp.json();
        typingEl.remove();

        if (!resp.ok || data.error) {
          throw new Error(data.error?.message || `Erro HTTP ${resp.status}`);
        }

        const respostaIA = data.texto || data.candidates?.[0]?.content?.parts?.[0]?.text || 'Não foi possível gerar uma resposta.';

        historicoConversa[historicoConversa.length - 1] = {
          role: 'user',
          parts: [{ text: textoUsuario }]
        };
        historicoConversa.push({
          role: 'model',
          parts: [{ text: respostaIA }]
        });

        adicionarMensagem(respostaIA, 'ai');
      } catch (err) {
        if (typingEl) typingEl.remove();
        historicoConversa.pop();
        adicionarMensagem(`Não foi possível concluir a análise agora (${err.message}). Tente novamente em alguns segundos.`, 'error');
      } finally {
        enviando = false;
        btnSend.disabled = false;
        userInput.focus();
      }
    }

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      enviarPergunta(userInput.value);
    });

    document.querySelectorAll('.suggestion-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        enviarPergunta(btn.getAttribute('data-q'));
      });
    });

    btnReset.addEventListener('click', () => {
      historicoConversa = [];
      const mensagens = chatArea.querySelectorAll('.msg-bubble:not(#insight-inicial)');
      mensagens.forEach(m => m.remove());
      if (suggestionsBox) suggestionsBox.style.display = 'flex';
    });

    carregarBaseDados();
  </script>
</body>
</html>
